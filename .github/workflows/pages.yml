name: Deploy AlVik to GitHub Pages

# Publishes the site to the gh-pages branch, which GitHub Pages serves from
# (Settings -> Pages -> Deploy from a branch -> gh-pages / root).
# This avoids the github-pages environment protection rule that blocks
# Actions-based deployments from non-default branches.
#
# Only the client is published. worker/ stays out of the deployed site — it
# runs on Cloudflare, and there is no reason to serve its source from Pages.

on:
  push:
    branches:
      - main
      # Lets the fix go live before it is merged. Safe to drop once merged.
      - claude/recover-deleted-chat-0xipau
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against publishing a secret
        run: |
          # The app password must never be baked into the client again.
          if grep -qE "const[[:space:]]+PASSWORD[[:space:]]*=" index.html; then
            echo "::error::index.html contains a hardcoded PASSWORD constant — refusing to deploy."
            exit 1
          fi
          if grep -qE "sk-[a-zA-Z0-9]{20,}" index.html; then
            echo "::error::index.html looks like it contains an API key — refusing to deploy."
            exit 1
          fi
          echo "No client-side secrets found."

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q
          # Identity must be set inside this fresh repo — it does not inherit
          # any config from the checkout above.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} to GitHub Pages"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages:gh-pages
