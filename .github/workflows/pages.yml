name: Deploy to GitHub Pages

# Publishes the site to the gh-pages branch. GitHub Pages serves that
# branch automatically (Settings → Pages → Deploy from a branch → gh-pages).
# This avoids the github-pages environment protection rule that blocks
# Actions-based deployments from non-default branches.

on:
  push:
    branches:
      - main
      - claude/industrial-chatbot-o7vw8g
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git checkout --orphan gh-pages-tmp
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7} to GitHub Pages"
          git push --force origin gh-pages-tmp:gh-pages
