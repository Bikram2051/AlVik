name: CI

# GitHub Pages publishes index.html directly from the main branch, so there
# is no deploy job here. This workflow exists to stop a secret from ever
# being committed into the client again — the app password and the DeepSeek
# API key belong in Cloudflare Worker secrets, never in index.html.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-client-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject secrets anywhere in the repository
        run: |
          status=0
          # Scan EVERY tracked file, not just index.html. A real key was once
          # committed into a comment in worker/worker.js, which a client-only
          # scan did not catch.
          files=$(git ls-files)

          if grep -nEI "sk-[a-zA-Z0-9]{20,}" $files; then
            echo "::error::Looks like a live API key. Keys belong in Cloudflare Worker secrets only, never in a tracked file."
            status=1
          fi

          # A bare token following the secret's name is always a pasted
          # value. Trailing comments (#) and end-of-line are fine.
          if grep -nEI "wrangler secret put[[:space:]]+[A-Z_]+[[:space:]]+[^#[:space:]]" $files; then
            echo "::error::A value appears after 'wrangler secret put NAME'. That command prompts for the value — never write it in the file."
            status=1
          fi

          if grep -nE "const[[:space:]]+PASSWORD[[:space:]]*=" index.html; then
            echo "::error file=index.html::Hardcoded PASSWORD constant. The app password must be a Worker secret (APP_PASSWORD), not shipped to the browser."
            status=1
          fi

          # The client must reach the proxy through PROXY_URL, never carry a
          # bearer credential of its own baked into the source.
          if grep -nE "Authorization'?\"?[[:space:]]*:[[:space:]]*[\`'\"]Bearer sk-" index.html; then
            echo "::error file=index.html::Hardcoded Authorization header with a key."
            status=1
          fi

          if [ "$status" -eq 0 ]; then
            echo "OK — no secrets found in any tracked file."
          fi
          exit "$status"

      - name: Check the worker keeps its auth gate
        run: |
          status=0
          for needle in "APP_PASSWORD" "AUTH_SECRET" "verifyToken" "constantTimeEquals"; do
            if ! grep -q "$needle" worker/worker.js; then
              echo "::error file=worker/worker.js::Missing '$needle' — the authentication gate looks removed."
              status=1
            fi
          done
          if [ "$status" -eq 0 ]; then
            echo "OK — worker authentication is in place."
          fi
          exit "$status"

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Run the suite
        run: npm test
