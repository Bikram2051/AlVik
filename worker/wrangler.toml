# Keep this name: it must match the existing Worker so `wrangler deploy`
# replaces it in place rather than creating a second one.
name = "deepseekv4pro"
main = "worker.js"
compatibility_date = "2025-01-01"

# Only these origins may call the proxy. Keep this tight — it is what stops
# another site from spending your DeepSeek credits with a stolen token.
[vars]
ALLOWED_ORIGINS = "https://bikram2051.github.io"

# Secrets — set via CLI, never committed:
#   wrangler secret put DEEPSEEK_API_KEY   # your DeepSeek API key
#   wrangler secret put APP_PASSWORD       # the password you type to log in
#   wrangler secret put AUTH_SECRET        # 32+ random chars, signs session tokens
